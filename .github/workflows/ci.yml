name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and verify database migrations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Run database verification tests
        run: npm test

      - name: Apply migrations
        run: npm run migrate:up

      - name: Confirm no migrations are pending
        run: |
          npm run migrate:status
          if npm run migrate:status | grep -q "PENDING"; then
            echo "Migrations are still pending."
            exit 1
          fi
