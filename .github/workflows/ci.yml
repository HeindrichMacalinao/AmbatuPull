name: CI

on:
  pull_request:
  push:
    branches: [main, S1-DBA-03-CI]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate user management schema
        run: python tests/verify_user_management.py

      - name: Validate QA fixtures
        run: python tests/verify_qa_fixtures.py

      - name: Validate migration runner
        run: |
          rm -f data/ci_test.db
          node scripts/migrate/index.js up --db=./data/ci_test.db --dir=./migrations
          node scripts/migrate/index.js status --db=./data/ci_test.db --dir=./migrations